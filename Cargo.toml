[package]
name = "sirius"
version = "0.1.0"
edition = "2024"
description = "the sirius programming language compiler and documentation"
repository = "https://github.com/lorentzj/sirius"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
lalrpop-util = "0.20"
console_error_panic_hook = "0.1"

[build-dependencies]
lalrpop = { version = "0.20", default-features = false }